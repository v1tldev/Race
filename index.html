<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Drift: Forest Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #050510;
            color: #e0e0ff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            text-align: left;
            text-shadow: 0 0 8px rgba(100, 140, 200, 0.5);
        }

        .score-label {
            font-size: 12px;
            color: #8a6bb0;
            letter-spacing: 2px;
        }

        .score-value {
            font-size: 36px;
            font-weight: 900;
            color: #6b9eb0;
        }

        .combo-box {
            text-align: right;
            opacity: 0;
            transition: opacity 0.3s, transform 0.1s;
        }

        .combo-box.active {
            opacity: 1;
            animation: pulse 0.5s infinite alternate;
        }

        .combo-label {
            font-size: 14px;
            color: #8a6bb0;
            letter-spacing: 2px;
        }

        .combo-value {
            font-size: 32px;
            font-weight: 900;
            color: #f0f0ff;
            text-shadow: 0 0 10px rgba(138, 107, 176, 0.7);
        }

        .center-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(10, 10, 20, 0.9);
            padding: 40px;
            border: 2px solid #5b7a9a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(91, 122, 154, 0.3);
        }

        .title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(to bottom, #6b9eb0, #8a6bb0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 16px;
            color: #8899aa;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        .gameover-title {
            font-size: 36px;
            font-weight: 900;
            color: #c87890;
            text-shadow: 0 0 15px rgba(200, 120, 144, 0.6);
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 24px;
            color: #bbccdd;
            margin-bottom: 20px;
        }

        .controls-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(200, 210, 230, 0.4);
            letter-spacing: 2px;
            pointer-events: none;
        }

        .touch-zones {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
        }

        .touch-left, .touch-right { flex: 1; }
        .touch-left.active { background: rgba(100, 140, 180, 0.05); }
        .touch-right.active { background: rgba(138, 107, 176, 0.05); }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="touch-zones" id="touchZones">
        <div class="touch-left" id="btnLeft"></div>
        <div class="touch-right" id="btnRight"></div>
    </div>

    <div class="ui-layer">
        <div class="top-ui">
            <div class="score-box">
                <div class="score-label">СЧЕТ ДРИФТА</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="combo-box" id="comboBox">
                <div class="combo-label">COMBO</div>
                <div class="combo-value" id="combo">x1.0</div>
            </div>
        </div>

        <div class="center-ui" id="startScreen">
            <div class="title">NEON<br>DRIFT</div>
            <div class="subtitle">НАЖМИ ЧТОБЫ НАЧАТЬ</div>
        </div>

        <div class="center-ui hidden" id="gameoverScreen">
            <div class="gameover-title">ВЫЛЕТ С ТРАССЫ</div>
            <div class="final-score" id="finalScore">0</div>
            <div class="subtitle">НАЖМИ ЧТОБЫ НАЧАТЬ ЗАНОВО</div>
        </div>

        <div class="controls-hint" id="hint">
            УДЕРЖИВАЙ ЛЕВУЮ / ПРАВУЮ СТОРОНУ, ЧТОБЫ ДРИФТОВАТЬ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'menu';
        let score = 0;
        let combo = 1.0;
        let comboTimer = 0;
        let frame = 0;
        let shake = 0;

        let track = [];
        const TRACK_WIDTH = 180;
        const SEGMENT_LENGTH = 40;
        let trackProgress = 0;
        let targetAngle = 0;
        let currentTrackAngle = 0;

        let decorations = [];

        // Функция отрисовки детального силуэта елки
        function drawPineTree(ctx, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            
            // Ствол
            ctx.fillRect(-size * 0.08, 0, size * 0.16, size * 0.25);
            
            // Нижний ярус (самый широкий)
            ctx.beginPath();
            ctx.moveTo(-size * 0.7, size * 0.1);
            ctx.lineTo(size * 0.7, size * 0.1);
            ctx.lineTo(0, -size * 0.4);
            ctx.fill();
            
            // Средний ярус
            ctx.beginPath();
            ctx.moveTo(-size * 0.5, -size * 0.2);
            ctx.lineTo(size * 0.5, -size * 0.2);
            ctx.lineTo(0, -size * 0.75);
            ctx.fill();
            
            // Верхний ярус (острый)
            ctx.beginPath();
            ctx.moveTo(-size * 0.3, -size * 0.55);
            ctx.lineTo(size * 0.3, -size * 0.55);
            ctx.lineTo(0, -size * 1.1);
            ctx.fill();
            
            ctx.restore();
        }

        function initTrack() {
            track = [];
            decorations = [];
            trackProgress = 0;
            currentTrackAngle = 0;
            targetAngle = 0;
            for (let i = 0; i < 100; i++) {
                addTrackSegment();
            }
        }

        function addTrackSegment() {
            const lastPt = track.length > 0 ? track[track.length - 1] : { x: 0, y: 0, angle: 0 };
            trackProgress++;

            if (trackProgress > 45 + Math.floor(Math.random() * 50)) {
                targetAngle = (Math.random() - 0.5) * 2.4;
                trackProgress = 0;
            }

            currentTrackAngle += (targetAngle - currentTrackAngle) * 0.08;

            const newX = lastPt.x + Math.sin(currentTrackAngle) * SEGMENT_LENGTH;
            const newY = lastPt.y - Math.cos(currentTrackAngle) * SEGMENT_LENGTH;

            track.push({ x: newX, y: newY, angle: currentTrackAngle });

            // Генерация детальных елок вдоль трассы
            if (Math.random() < 0.35) { 
                const side = Math.random() > 0.5 ? 1 : -1; 
                // Деревья стоят дальше от дороги, создавая ощущение просеки
                const dist = (TRACK_WIDTH / 2) + 60 + Math.random() * 300;
                
                const perpX = Math.cos(currentTrackAngle) * dist * side;
                const perpY = Math.sin(currentTrackAngle) * dist * side;

                // Очень тёмный цвет для силуэта, сливающийся с ночью
                const treeColor = `rgba(${10 + Math.random()*10}, ${10 + Math.random()*10}, ${25 + Math.random()*15}, 0.9)`;
                
                decorations.push({
                    x: newX + perpX,
                    y: newY + perpY,
                    size: 25 + Math.random() * 45, // Разный размер деревьев
                    color: treeColor,
                    layer: Math.random() > 0.5 ? 'back' : 'front' // Для эффекта параллакса/глубины
                });
            }

            if (track.length > 800) {
                track.shift();
                decorations = decorations.filter(d => {
                    const dy = d.y - track[0].y; 
                    return dy < 1200; 
                });
            }
        }

        const car = {
            x: 0, y: 0, width: 22, height: 40, angle: 0,
            vx: 0, vy: 0, baseSpeed: 6.5, currentSpeed: 6.5, driftFactor: 0
        };

        let input = { left: false, right: false };
        let particles = [];
        const MAX_PARTICLES = 200;

        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const comboBox = document.getElementById('comboBox');
        const startScreen = document.getElementById('startScreen');
        const gameoverScreen = document.getElementById('gameoverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const hint = document.getElementById('hint');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        const handleStart = (side) => {
            if (gameState === 'menu' || gameState === 'gameover') { startGame(); return; }
            if (gameState !== 'playing') return;
            input[side] = true;
            if (side === 'left') btnLeft.classList.add('active');
            if (side === 'right') btnRight.classList.add('active');
        };

        const handleEnd = (side) => {
            input[side] = false;
            if (side === 'left') btnLeft.classList.remove('active');
            if (side === 'right') btnRight.classList.remove('active');
        };

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart('left'); });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd('left'); });
        btnLeft.addEventListener('mousedown', () => handleStart('left'));
        btnLeft.addEventListener('mouseup', () => handleEnd('left'));
        btnLeft.addEventListener('mouseleave', () => handleEnd('left'));

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart('right'); });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd('right'); });
        btnRight.addEventListener('mousedown', () => handleStart('right'));
        btnRight.addEventListener('mouseup', () => handleEnd('right'));
        btnRight.addEventListener('mouseleave', () => handleEnd('right'));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleStart('left');
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleStart('right');
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleEnd('left');
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleEnd('right');
        });

        function startGame() {
            gameState = 'playing';
            score = 0; combo = 1.0; comboTimer = 0; shake = 0; particles = [];
            input.left = false; input.right = false;
            btnLeft.classList.remove('active'); btnRight.classList.remove('active');
            initTrack();

            car.x = track[20].x;
            car.y = track[20].y;
            car.angle = track[20].angle;
            car.vx = Math.sin(car.angle) * car.baseSpeed;
            car.vy = -Math.cos(car.angle) * car.baseSpeed;
            car.currentSpeed = car.baseSpeed;

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            hint.classList.remove('hidden');
        }

        function gameOver() {
            gameState = 'gameover';
            finalScoreEl.innerText = 'СЧЕТ: ' + Math.floor(score).toLocaleString();
            gameoverScreen.classList.remove('hidden');
            hint.classList.add('hidden');
            car.currentSpeed = 0; car.vx = 0; car.vy = 0; particles = [];
        }

        function spawnSmoke(x, y, angle, speedMultiplier) {
            if (particles.length >= MAX_PARTICLES) return;
            const spread = (Math.random() - 0.5) * 0.8;
            const speed = (Math.random() * 2 + 1) * speedMultiplier;
            particles.push({
                x: x, y: y,
                vx: Math.sin(angle + spread) * speed + car.vx * 0.3,
                vy: Math.cos(angle + spread) * speed + car.vy * 0.3,
                life: 1.0, decay: 0.02 + Math.random() * 0.03,
                size: Math.random() * 8 + 4, color: `rgba(150, 180, 210,`
            });
        }

        function update() {
            if (gameState !== 'playing') return;
            frame++;

            const lastTrackPoint = track[track.length - 1];
            const distToEnd = Math.sqrt((car.x - lastTrackPoint.x)**2 + (car.y - lastTrackPoint.y)**2);

            let addedThisFrame = 0;
            // Увеличена дистанция генерации до 1000, чтобы трасса создавалась далеко в тумане
            while (distToEnd < 1000 && addedThisFrame < 15) { 
                addTrackSegment();
                addedThisFrame++;
                const newLast = track[track.length - 1];
                if (Math.sqrt((car.x - newLast.x)**2 + (car.y - newLast.y)**2) >= 1000) break;
            }

            let minDist = Infinity;
            for (let i = 0; i < track.length; i++) {
                const dist = Math.sqrt((car.x - track[i].x)**2 + (car.y - track[i].y)**2);
                if (dist < minDist) minDist = dist;
            }

            if (minDist >= (TRACK_WIDTH / 2)) { gameOver(); return; }

            if (input.left) car.angle -= 0.05;
            if (input.right) car.angle += 0.05;
            car.angle = Math.max(-1.5, Math.min(1.5, car.angle));

            const targetVx = Math.sin(car.angle) * car.currentSpeed;
            const targetVy = -Math.cos(car.angle) * car.currentSpeed;
            const driftLag = 0.06 + (Math.abs(car.angle - Math.atan2(car.vx, -car.vy)) * 0.02);
            car.vx += (targetVx - car.vx) * driftLag;
            car.vy += (targetVy - car.vy) * driftLag;
            car.x += car.vx; car.y += car.vy;
            car.currentSpeed += (car.baseSpeed - car.currentSpeed) * 0.05;

            const velocityAngle = Math.atan2(car.vx, -car.vy);
            let normalizedDrift = Math.abs(car.angle - velocityAngle);
            if (normalizedDrift > Math.PI) normalizedDrift = Math.PI * 2 - normalizedDrift;
            car.driftFactor = normalizedDrift;

            if (normalizedDrift > 0.15) {
                comboTimer = 60;
                combo = Math.min(combo + 0.015, 5.0);
                score += Math.floor(normalizedDrift * 15 * combo);
                const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
                spawnSmoke(car.x - sin * 18 - 8, car.y + cos * 18, car.angle, 1.5);
                spawnSmoke(car.x - sin * 18 + 8, car.y + cos * 18, car.angle, 1.5);
                if (combo > 2.5 && Math.random() > 0.8) shake = 2;
            } else {
                comboTimer--;
                if (comboTimer <= 0) combo = 1.0;
            }

            scoreEl.innerText = Math.floor(score).toLocaleString();
            if (combo > 1.2) {
                comboBox.classList.add('active');
                comboEl.innerText = 'x' + combo.toFixed(1);
            } else {
                comboBox.classList.remove('active');
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.size += 0.4;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            const camX = width / 2 - car.x;
            const camY = (height * 0.75) - car.y;
            const shakeX = shake > 0 ? (Math.random() - 0.5) * shake : 0;
            const shakeY = shake > 0 ? (Math.random() - 0.5) * shake : 0;
            ctx.translate(camX + shakeX, camY + shakeY);

            // 1. Рисуем задний план леса (дальние деревья)
            decorations.filter(d => d.layer === 'back').forEach(d => {
                drawPineTree(ctx, d.x, d.y, d.size, d.color);
            });

            // 2. Рисуем трассу (перекрывает нижнюю часть дальних деревьев)
            if (track.length > 1) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#5b4a7a';
                ctx.strokeStyle = '#6a5b8a';
                ctx.lineWidth = TRACK_WIDTH;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(track[0].x, track[0].y);
                for (let i = 1; i < track.length; i++) ctx.lineTo(track[i].x, track[i].y);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#1c1c2e';
                ctx.lineWidth = TRACK_WIDTH - 8;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(110, 140, 170, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([20, 30]);
                ctx.beginPath();
                ctx.moveTo(track[0].x, track[0].y);
                for (let i = 1; i < track.length; i++) ctx.lineTo(track[i].x, track[i].y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 3. Рисуем передний план леса (ближние деревья, перекрывают края трассы для глубины)
            decorations.filter(d => d.layer === 'front').forEach(d => {
                drawPineTree(ctx, d.x, d.y, d.size, d.color);
            });

            // 4. Частицы и машина
            particles.forEach(p => {
                ctx.fillStyle = p.color + p.life * 0.35 + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            if (gameState === 'playing' || gameState === 'gameover') {
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle);

                ctx.shadowBlur = 8;
                ctx.shadowColor = '#5b8a9f';
                ctx.fillStyle = '#0e0e1a';
                ctx.strokeStyle = '#5b8a9f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 5);
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#5b8a9f';
                ctx.globalAlpha = 0.4;
                ctx.fillRect(-car.width / 2 + 3, -car.height / 2 + 8, car.width - 6, 10);
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = '#d0e8ff';
                ctx.shadowColor = '#d0e8ff';
                ctx.shadowBlur = 14;
                ctx.fillRect(-car.width / 2 + 2, -car.height / 2, 5, 3);
                ctx.fillRect(car.width / 2 - 7, -car.height / 2, 5, 3);

                const brakeIntensity = car.driftFactor > 0.2 ? 1.0 : 0.4;
                ctx.fillStyle = `rgba(200, 60, 80, ${brakeIntensity})`;
                ctx.shadowColor = '#c83250';
                ctx.shadowBlur = 10 * brakeIntensity;
                ctx.fillRect(-car.width / 2 + 2, car.height / 2 - 3, 7, 3);
                ctx.fillRect(car.width / 2 - 9, car.height / 2 - 3, 7, 3);
                ctx.restore();

                // Фары
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle);
                ctx.globalCompositeOperation = 'screen';
                const beamGrad = ctx.createLinearGradient(0, -car.height / 2, 0, -car.height / 2 - 160);
                beamGrad.addColorStop(0, 'rgba(100, 140, 180, 0.2)');
                beamGrad.addColorStop(1, 'rgba(100, 140, 180, 0)');
                ctx.fillStyle = beamGrad;
                ctx.beginPath();
                ctx.moveTo(-car.width / 2 + 4, -car.height / 2);
                ctx.lineTo(-car.width - 15, -car.height / 2 - 160);
                ctx.lineTo(car.width + 15, -car.height / 2 - 160);
                ctx.lineTo(car.width / 2 - 4, -car.height / 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();

            // 5. ГЛАВНЫЙ ЭФФЕКТ: Туман с фокусом ВПЕРЕДИ от машины
            // Центр градиента смещён вверх (вперёд по направлению движения), 
            // что создаёт эффект "света фар в тумане" и полностью скрывает генерацию трассы сверху.
            const screenCarX = width / 2 + shakeX;
            const screenCarY = height * 0.75 + shakeY;

            const fogGrad = ctx.createRadialGradient(
                screenCarX, screenCarY - 150, 80,   // Фокус смещён вперёд (вверх по экрану)
                screenCarX, screenCarY - 150, 1000  // Огромный радиус затухания
            );
            fogGrad.addColorStop(0, 'rgba(5, 5, 16, 0)');       // Вокруг машины и чуть впереди чисто
            fogGrad.addColorStop(0.25, 'rgba(5, 5, 16, 0.3)');  // Мягкая дымка
            fogGrad.addColorStop(0.55, 'rgba(5, 5, 16, 0.85)'); // Густой туман
            fogGrad.addColorStop(1, 'rgba(5, 5, 16, 0.98)');    // Полная темнота по краям и вдали

            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, width, height);
            
            // Дополнительная нижняя виньетка для плавного исчезновения сзади (как вы просили ранее)
            const backFog = ctx.createLinearGradient(0, height * 0.85, 0, height);
            backFog.addColorStop(0, 'rgba(5, 5, 16, 0)');
            backFog.addColorStop(1, 'rgba(5, 5, 16, 0.9)');
            ctx.fillStyle = backFog;
            ctx.fillRect(0, height * 0.85, width, height * 0.15);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initTrack();
        loop();

        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    </script>
</body>
</html>
