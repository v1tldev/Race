<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Drift: TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            touch-action: none; -webkit-touch-callout: none; 
            -webkit-user-select: none; user-select: none;
            overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #050510; color: #e0e0ff; font-family: 'Orbitron', sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
        }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .ui-layer { 
            position: absolute; z-index: 10; width: 100%; height: 100%; 
            pointer-events: none; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 20px; 
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.92); backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 20; transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none !important; }
        
        .title { 
            font-size: clamp(36px, 10vw, 52px); font-weight: 900; text-align: center;
            background: linear-gradient(to bottom, #6b9eb0, #8a6bb0); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-bottom: 10px; letter-spacing: 3px; 
        }
        .subtitle { font-size: 14px; color: #8899aa; letter-spacing: 2px; margin-bottom: 40px; text-align: center;}
        
        .btn {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #5b7a9a; color: #e0e0ff;
            padding: 16px 40px; font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: 700; letter-spacing: 2px;
            border-radius: 8px; cursor: pointer; margin: 10px;
            box-shadow: 0 0 15px rgba(91, 122, 154, 0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 80%; max-width: 300px; text-align: center;
        }
        .btn:active { transform: scale(0.95); box-shadow: 0 0 5px rgba(91, 122, 154, 0.5); }
        .btn-primary { border-color: #6b9eb0; background: linear-gradient(135deg, #1a2a3a, #0f1a2a); }
        
        .profile-box {
            background: rgba(10, 10, 20, 0.9); border: 1px solid #5b7a9a;
            border-radius: 12px; padding: 30px; width: 85%; max-width: 320px;
            text-align: center; margin-bottom: 20px;
        }
        .profile-name { font-size: 24px; font-weight: 900; color: #d0e8ff; margin-bottom: 5px; }
        .profile-id { font-size: 12px; color: #5b7a9a; letter-spacing: 1px; margin-bottom: 25px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; border-bottom: 1px solid rgba(91, 122, 154, 0.3); padding-bottom: 10px; }
        .stat-label { color: #8a6bb0; font-size: 14px; }
        .stat-value { color: #6b9eb0; font-size: 22px; font-weight: 700; }

        .top-ui { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; width: 100%; }
        .score-box { text-align: left; }
        .score-label { font-size: 11px; color: #8a6bb0; letter-spacing: 2px; }
        .score-value { font-size: 28px; font-weight: 900; color: #6b9eb0; }
        .dist-box { text-align: right; }
        .dist-label { font-size: 11px; color: #8a6bb0; letter-spacing: 2px; }
        .dist-value { font-size: 24px; font-weight: 900; color: #c87890; }
        
        .touch-zones { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: flex; pointer-events: auto; }
        .touch-left, .touch-right { flex: 1; }
        .touch-left.active { background: rgba(100, 140, 180, 0.06); }
        .touch-right.active { background: rgba(138, 107, 176, 0.06); }

        #gameoverScreen { cursor: pointer; justify-content: center; }
        .tap-hint { font-size: 12px; color: #5b7a9a; margin-top: 15px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="touch-zones" id="touchZones">
        <div class="touch-left" id="btnLeft"></div>
        <div class="touch-right" id="btnRight"></div>
    </div>

    <div class="ui-layer" id="gameHud" style="display: none;">
        <div class="top-ui">
            <div class="score-box">
                <div class="score-label">СЧЕТ</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="dist-box">
                <div class="dist-label">ДИСТАНЦИЯ</div>
                <div class="dist-value" id="distance">0 м</div>
            </div>
        </div>
    </div>

    <div class="screen" id="mainMenu">
        <div class="title">NEON<br>DRIFT</div>
        <div class="subtitle">TMA EDITION</div>
        <div class="btn btn-primary" id="btnPlay">ИГРАТЬ</div>
        <div class="btn" id="btnProfile">ПРОФИЛЬ</div>
    </div>

    <div class="screen hidden" id="profileScreen">
        <div class="profile-box">
            <div class="profile-name" id="profileName">Гонщик</div>
            <div class="profile-id" id="profileId">ID: ---</div>
            <div class="stat-row">
                <span class="stat-label">ЛУЧШИЙ СЧЕТ</span>
                <span class="stat-value" id="profileHighScore">0</span>
            </div>
            <div class="stat-row" style="border: none; margin-bottom: 0;">
                <span class="stat-label">ВСЕГО ЗАЕЗДОВ</span>
                <span class="stat-value" id="profileRaces">0</span>
            </div>
        </div>
        <div class="btn" id="btnBackToMenu" style="margin-top: 10px;">НАЗАД</div>
    </div>

    <div class="screen hidden" id="gameoverScreen">
        <div class="title" style="font-size: 32px; -webkit-text-fill-color: #c87890; color: #c87890;">ВЫЛЕТ</div>
        <div class="profile-box" style="padding: 20px; margin-bottom: 10px; min-width: 250px;">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span class="stat-label">ВАШ СЧЕТ</span>
                <span class="stat-value" style="font-size: 36px; color: #f0f0ff; margin-top: 5px;" id="finalScore">0</span>
            </div>
        </div>
        <div class="tap-hint">ТАПНИ В ЛЮБОЕ МЕСТО ДЛЯ РЕСТАРТА</div>
        <div class="btn" id="btnToMenu" style="margin-top: 20px; width: 60%; max-width: 200px; font-size: 14px; padding: 12px;">В МЕНЮ</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id || 'guest_' + Math.random().toString(36).substr(2, 9);
        const userName = user.username || user.first_name || 'Гонщик';
        
        const vibrate = (type = 'light') => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
        };

        const getLS = (key, def) => localStorage.getItem('nd_' + userId + '_' + key) || def;
        const setLS = (key, val) => localStorage.setItem('nd_' + userId + '_' + key, val);
        
        let highScore = parseInt(getLS('highscore', 0));
        let totalRaces = parseInt(getLS('races', 0));

        document.getElementById('profileName').innerText = userName;
        document.getElementById('profileId').innerText = 'ID: ' + userId;
        document.getElementById('profileHighScore').innerText = highScore.toLocaleString();
        document.getElementById('profileRaces').innerText = totalRaces;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
        let width, height, SCALE = 1, DPR = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            SCALE = Math.min(width, height) / 700;
            canvas.width = width * DPR;
            canvas.height = height * DPR;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(DPR, DPR);
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'menu';
        let score = 0, distance = 0, frame = 0, shake = 0, lastTime = 0;
        
        let track = [], forkBranch = []; 
        let decorations = [], potholes = [];
        
        const BASE_TRACK_WIDTH = 160, BASE_SEGMENT_LENGTH = 35;
        let trackProgress = 0, targetAngle = 0, currentTrackAngle = 0;
        let segmentsSincePothole = 0; 
        
        // Логика развилок
        let nextForkIndex = 150; // Генерируем развилку, когда трасса достигнет этого кол-ва сегментов
        let forkSwitched = false;

        const MAX_PARTICLES = 150;
        const particles = Array.from({ length: MAX_PARTICLES }, () => ({
            x: 0, y: 0, vx: 0, vy: 0, life: 0, size: 0, active: false
        }));

        function spawnSmoke(x, y, angle, speedMult) {
            const p = particles.find(p => !p.active);
            if (!p) return;
            p.active = true; p.x = x; p.y = y; p.life = 1.0;
            p.size = (4 + Math.random() * 5) * SCALE;
            const spread = (Math.random() - 0.5) * 0.7;
            const speed = (1.5 + Math.random() * 1.5) * speedMult * SCALE;
            p.vx = Math.sin(angle + spread) * speed;
            p.vy = Math.cos(angle + spread) * speed;
        }

        const car = { 
            x: 0, y: 0, width: 20, height: 38, angle: 0, vx: 0, vy: 0, 
            baseSpeed: 8.5, currentSpeed: 8.5, driftFactor: 0, skidTime: 0 
        };
        let input = { left: false, right: false };

        function drawTree(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x - size * 0.6, y + size * 0.2);
            ctx.lineTo(x + size * 0.6, y + size * 0.2);
            ctx.lineTo(x, y - size * 0.5);
            ctx.moveTo(x - size * 0.4, y - size * 0.2);
            ctx.lineTo(x + size * 0.4, y - size * 0.2);
            ctx.lineTo(x, y - size * 0.9);
            ctx.fill();
        }

        function drawPothole(ctx, x, y, size) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(20, 20, 30, 0.9)';
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.65, size * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function initTrack() {
            track = []; forkBranch = []; decorations = []; potholes = []; 
            trackProgress = 0; currentTrackAngle = 0; targetAngle = 0;
            segmentsSincePothole = 0;
            nextForkIndex = 150;
            forkSwitched = false;
            
            for (let i = 0; i < 100; i++) addTrackSegment();
            
            car.x = track[20].x; car.y = track[20].y; car.angle = track[20].angle;
            car.vx = Math.sin(car.angle) * car.baseSpeed * SCALE;
            car.vy = -Math.cos(car.angle) * car.baseSpeed * SCALE;
            car.currentSpeed = car.baseSpeed * SCALE;
            car.skidTime = 0;
            distance = 0;
        }

        function addTrackSegment() {
            const last = track.length > 0 ? track[track.length - 1] : { x: 0, y: 0, angle: 0 };
            trackProgress++;
            
            if (trackProgress > 30 + Math.floor(Math.random() * 35)) {
                targetAngle = (Math.random() - 0.5) * 3.2;
                trackProgress = 0;
            }
            currentTrackAngle += (targetAngle - currentTrackAngle) * 0.12;
            
            const segLen = BASE_SEGMENT_LENGTH * SCALE;
            const newX = last.x + Math.sin(currentTrackAngle) * segLen;
            const newY = last.y - Math.cos(currentTrackAngle) * segLen;
            track.push({ x: newX, y: newY, angle: currentTrackAngle });

            // Генерация ям
            segmentsSincePothole++;
            if (track.length > 25 && segmentsSincePothole > 12 && Math.random() < 0.04) {
                segmentsSincePothole = 0;
                const trackW = BASE_TRACK_WIDTH * SCALE;
                const offset = (Math.random() - 0.5) * (trackW * 0.7);
                const perpX = Math.cos(currentTrackAngle) * offset;
                const perpY = Math.sin(currentTrackAngle) * offset;
                potholes.push({ x: newX + perpX, y: newY + perpY, size: 15 * SCALE, active: true });
            }

            // Генерация леса
            if (Math.random() < 0.5) {
                const side = Math.random() > 0.5 ? 1 : -1;
                const dist = (BASE_TRACK_WIDTH * SCALE / 2) + (50 * SCALE) + Math.random() * (350 * SCALE);
                decorations.push({
                    x: newX + Math.cos(currentTrackAngle) * dist * side,
                    y: newY + Math.sin(currentTrackAngle) * dist * side,
                    size: (30 + Math.random() * 45) * SCALE,
                    color: `rgba(${4 + Math.random()*8}, ${4 + Math.random()*8}, ${14 + Math.random()*12}, 1)`,
                    layer: Math.random() > 0.5 ? 'back' : 'front'
                });
            }

            // ЛОГИКА РАЗВИЛКИ (ПЛАВНАЯ И КРАСИВАЯ)
            if (track.length >= nextForkIndex && forkBranch.length === 0) {
                forkSwitched = false;
                const dir = Math.random() > 0.5 ? 1 : -1;
                // Плавный угол отхождения (~35 градусов)
                const branchAngle = currentTrackAngle + (dir * 0.6); 
                
                let bx = newX;
                let by = newY;
                let bAngle = branchAngle;
                
                // Сразу генерируем 60 сегментов ветки, чтобы она уже была на экране
                forkBranch = [{ x: bx, y: by, angle: bAngle }];
                for (let i = 0; i < 60; i++) {
                    // Небольшие плавные изгибы, как на настоящей дороге
                    bAngle += (Math.random() - 0.5) * 0.25; 
                    bx += Math.sin(bAngle) * segLen;
                    by -= Math.cos(bAngle) * segLen;
                    forkBranch.push({ x: bx, y: by, angle: bAngle });
                }
                
                // Следующая развилка будет не скоро
                nextForkIndex = track.length + 250; 
            }

            // Очистка старых данных
            if (track.length > 400) {
                track.splice(0, 80);
                if (forkBranch.length > 0 && forkSwitched) {
                    // Если мы уже на ветке, чистим и её, но аккуратно
                    // (на практике forkBranch становится track, так что это сработает для нового track)
                }
                
                let w = 0;
                const maxD = (650 * SCALE) ** 2;
                for (let i = 0; i < decorations.length; i++) {
                    const dx = decorations[i].x - car.x, dy = decorations[i].y - car.y;
                    if (dx * dx + dy * dy < maxD) decorations[w++] = decorations[i];
                }
                decorations.length = w;

                w = 0;
                for (let i = 0; i < potholes.length; i++) {
                    const dx = potholes[i].x - car.x, dy = potholes[i].y - car.y;
                    if (dx * dx + dy * dy < maxD) potholes[w++] = potholes[i];
                }
                potholes.length = w;
            }
        }

        const handleStart = (side) => {
            if (gameState !== 'playing') return;
            input[side] = true;
            document.getElementById(side === 'left' ? 'btnLeft' : 'btnRight').classList.add('active');
            vibrate('light');
        };
        const handleEnd = (side) => {
            input[side] = false;
            document.getElementById(side === 'left' ? 'btnLeft' : 'btnRight').classList.remove('active');
        };

        ['touchstart', 'mousedown'].forEach(e => {
            document.getElementById('btnLeft').addEventListener(e, (ev) => { ev.preventDefault(); handleStart('left'); });
            document.getElementById('btnRight').addEventListener(e, (ev) => { ev.preventDefault(); handleStart('right'); });
        });
        ['touchend', 'mouseup', 'mouseleave', 'touchcancel'].forEach(e => {
            document.getElementById('btnLeft').addEventListener(e, (ev) => { ev.preventDefault(); handleEnd('left'); });
            document.getElementById('btnRight').addEventListener(e, (ev) => { ev.preventDefault(); handleEnd('right'); });
        });

        function update(dt) {
            if (gameState !== 'playing') return;
            
            const last = track[track.length - 1];
            if (Math.hypot(car.x - last.x, car.y - last.y) < 800 * SCALE) {
                addTrackSegment();
            }

            // ПРОВЕРКА ПЕРЕКЛЮЧЕНИЯ НА ВЕТКУ
            if (forkBranch.length > 0 && !forkSwitched) {
                // Проверяем, подъехал ли игрок к середине ветки
                const midBranch = forkBranch[Math.floor(forkBranch.length / 2)];
                const distToBranch = Math.hypot(car.x - midBranch.x, car.y - midBranch.y);
                
                if (distToBranch < 100 * SCALE) {
                    // Игрок выбрал ветку! Делаем её основной дорогой
                    track = forkBranch;
                    currentTrackAngle = forkBranch[forkBranch.length - 1].angle;
                    forkBranch = []; // Очищаем, теперь это часть main track
                    forkSwitched = true;
                    vibrate('medium');
                }
            }

            // Проверка столкновений с дорогой
            let minDist = Infinity;
            const checkArrays = [track];
            if (forkBranch.length > 0) checkArrays.push(forkBranch);

            for (let arr of checkArrays) {
                const startCheck = Math.max(0, arr.length - 120);
                for (let i = startCheck; i < arr.length; i += 2) {
                    const d = Math.hypot(car.x - arr[i].x, car.y - arr[i].y);
                    if (d < minDist) minDist = d;
                }
            }

            if (minDist >= (BASE_TRACK_WIDTH * SCALE / 2)) {
                gameOver(); return;
            }

            // Ямы
            for (let i = 0; i < potholes.length; i++) {
                const p = potholes[i];
                if (!p.active) continue;
                const dist = Math.hypot(car.x - p.x, car.y - p.y);
                if (dist < (p.size + 8 * SCALE)) {
                    p.active = false;
                    const skidDir = Math.random() > 0.5 ? 1 : -1;
                    car.angle += skidDir * 0.4; 
                    car.skidTime = 40; 
                    car.currentSpeed *= 0.9;
                    shake = 5 * SCALE;
                    vibrate('heavy');
                }
            }

            // Управление (полная свобода 360 градусов)
            if (input.left) car.angle -= 0.065 * dt;
            if (input.right) car.angle += 0.065 * dt;

            const tVx = Math.sin(car.angle) * car.currentSpeed;
            const tVy = -Math.cos(car.angle) * car.currentSpeed;
            
            let currentLag = 0.07 + (Math.abs(car.angle - Math.atan2(car.vx, -car.vy)) * 0.02);
            if (car.skidTime > 0) {
                car.skidTime -= dt;
                currentLag = 0.015;
            }
            
            car.vx += (tVx - car.vx) * currentLag * dt;
            car.vy += (tVy - car.vy) * currentLag * dt;
            car.x += car.vx * dt;
            car.y += car.vy * dt;
            car.currentSpeed += ((car.baseSpeed * SCALE) - car.currentSpeed) * 0.06 * dt;

            let drift = Math.abs(car.angle - Math.atan2(car.vx, -car.vy));
            if (drift > Math.PI) drift = Math.PI * 2 - drift;
            car.driftFactor = drift;

            if (drift > 0.15 && car.skidTime <= 0) {
                score += Math.floor(drift * 15 * dt);
                const c = Math.cos(car.angle), s = Math.sin(car.angle);
                const off = 16 * SCALE;
                spawnSmoke(car.x - s * off - 7*SCALE, car.y + c * off, car.angle, 1.5);
                spawnSmoke(car.x - s * off + 7*SCALE, car.y + c * off, car.angle, 1.5);
                if (drift > 0.3 && Math.random() > 0.9) {
                    shake = 2.5 * SCALE;
                    vibrate('medium');
                }
            }

            distance += (car.currentSpeed * dt) * 0.15;
            document.getElementById('score').innerText = Math.floor(score).toLocaleString();
            document.getElementById('distance').innerText = Math.floor(distance) + " м";

            for (let i = 0; i < MAX_PARTICLES; i++) {
                const p = particles[i];
                if (!p.active) continue;
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.life -= 0.035 * dt; p.size += 0.3 * dt * SCALE;
                if (p.life <= 0) p.active = false;
            }

            if (shake > 0) { shake *= Math.pow(0.85, dt); if (shake < 0.4 * SCALE) shake = 0; }
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            const camX = width / 2 - car.x;
            const camY = (height * 0.7) - car.y;
            const sX = shake > 0 ? (Math.random() - 0.5) * shake : 0;
            const sY = shake > 0 ? (Math.random() - 0.5) * shake : 0;
            ctx.translate(camX + sX, camY + sY);

            const tw = BASE_TRACK_WIDTH * SCALE;

            const drawPath = (pathArr, isFork) => {
                if (pathArr.length < 2) return;
                const startIdx = Math.max(0, pathArr.length - 120);
                // Ветка чуть тусклее, чтобы обозначить выбор, но всё еще видна
                const alpha = isFork ? 0.4 : 0.5;
                const color = isFork ? '#5a4b6a' : '#6a5b8a';

                ctx.strokeStyle = `rgba(90, 70, 110, ${alpha})`;
                ctx.lineWidth = tw + 12 * SCALE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath(); ctx.moveTo(pathArr[startIdx].x, pathArr[startIdx].y);
                for (let i = startIdx + 1; i < pathArr.length; i++) ctx.lineTo(pathArr[i].x, pathArr[i].y);
                ctx.stroke();

                ctx.strokeStyle = color; ctx.lineWidth = tw; ctx.stroke();
                ctx.strokeStyle = '#1c1c2e'; ctx.lineWidth = tw - 6 * SCALE; ctx.stroke();
                
                ctx.strokeStyle = `rgba(110, 140, 170, ${isFork ? 0.25 : 0.4})`; 
                ctx.lineWidth = 2 * SCALE;
                ctx.setLineDash([15 * SCALE, 25 * SCALE]); ctx.stroke(); ctx.setLineDash([]);
            };

            drawPath(track, false);
            if (forkBranch.length > 0) drawPath(forkBranch, true);

            // Неоновый маркер развилки (шеврон)
            if (forkBranch.length > 0 && !forkSwitched) {
                const marker = forkBranch[2]; // Точка чуть после начала ветки
                ctx.fillStyle = 'rgba(200, 120, 144, 0.9)';
                ctx.shadowBlur = 12 * SCALE;
                ctx.shadowColor = '#c87890';
                ctx.beginPath();
                ctx.arc(marker.x, marker.y, 6 * SCALE, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            const viewD = (600 * SCALE) ** 2;
            
            for (let i = 0; i < decorations.length; i++) {
                const d = decorations[i];
                if ((d.x - car.x)**2 + (d.y - car.y)**2 < viewD) {
                    drawTree(ctx, d.x, d.y, d.size, d.color);
                }
            }

            for (let i = 0; i < potholes.length; i++) {
                const p = potholes[i];
                if ((p.x - car.x)**2 + (p.y - car.y)**2 < viewD) {
                    drawPothole(ctx, p.x, p.y, p.size);
                }
            }

            for (let i = 0; i < MAX_PARTICLES; i++) {
                const p = particles[i];
                if (!p.active) continue;
                ctx.fillStyle = `rgba(140, 160, 190, ${p.life * 0.35})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.2832); ctx.fill();
            }

            if (gameState === 'playing' || gameState === 'gameover') {
                ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
                const cw = car.width * SCALE, ch = car.height * SCALE;
                
                ctx.fillStyle = '#0e0e1a'; ctx.strokeStyle = '#5b8a9f'; ctx.lineWidth = 2 * SCALE;
                ctx.beginPath(); ctx.roundRect(-cw/2, -ch/2, cw, ch, 4*SCALE); ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = '#d0e8ff';
                ctx.fillRect(-cw/2 + 2*SCALE, -ch/2, 4*SCALE, 3*SCALE);
                ctx.fillRect(cw/2 - 6*SCALE, -ch/2, 4*SCALE, 3*SCALE);
                
                const br = car.driftFactor > 0.2 ? 1.0 : 0.4;
                ctx.fillStyle = `rgba(200, 60, 80, ${br})`;
                ctx.fillRect(-cw/2 + 2*SCALE, ch/2 - 3*SCALE, 6*SCALE, 3*SCALE);
                ctx.fillRect(cw/2 - 8*SCALE, ch/2 - 3*SCALE, 6*SCALE, 3*SCALE);
                ctx.restore();

                ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
                ctx.globalCompositeOperation = 'screen';
                const beamLen = 180 * SCALE;
                const grad = ctx.createLinearGradient(0, -ch/2, 0, -ch/2 - beamLen);
                grad.addColorStop(0, 'rgba(220, 240, 255, 0.35)');
                grad.addColorStop(0.4, 'rgba(150, 190, 230, 0.12)');
                grad.addColorStop(1, 'rgba(100, 140, 180, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(-10*SCALE, -ch/2);
                ctx.lineTo(-65*SCALE, -ch/2 - beamLen);
                ctx.lineTo(65*SCALE, -ch/2 - beamLen);
                ctx.lineTo(10*SCALE, -ch/2);
                ctx.closePath();
                ctx.fill();

                const hotGrad = ctx.createRadialGradient(0, -ch/2, 2*SCALE, 0, -ch/2 - 25*SCALE, 45*SCALE);
                hotGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
                hotGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = hotGrad;
                ctx.beginPath(); ctx.arc(0, -ch/2, 45*SCALE, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
            ctx.restore();

            const fogR = 450 * SCALE;
            const fg = ctx.createRadialGradient(width/2, height*0.7, 60*SCALE, width/2, height*0.7, fogR);
            fg.addColorStop(0, 'rgba(5, 5, 16, 0)');
            fg.addColorStop(0.5, 'rgba(5, 5, 16, 0.6)');
            fg.addColorStop(1, 'rgba(5, 5, 16, 1)');
            ctx.fillStyle = fg; ctx.fillRect(0, 0, width, height);
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 16.666, 3.0);
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            gameState = 'playing';
            score = 0; shake = 0;
            particles.forEach(p => p.active = false);
            totalRaces++;
            setLS('races', totalRaces);
            initTrack();
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameoverScreen').classList.add('hidden');
            document.getElementById('gameHud').style.display = 'flex';
            vibrate('medium');
        }

        function gameOver() {
            gameState = 'gameover';
            vibrate('heavy');
            if (score > highScore) {
                highScore = score;
                setLS('highscore', highScore);
            }
            document.getElementById('finalScore').innerText = Math.floor(score).toLocaleString();
            document.getElementById('gameHud').style.display = 'none';
            document.getElementById('gameoverScreen').classList.remove('hidden');
        }

        function showProfile() {
            document.getElementById('profileHighScore').innerText = highScore.toLocaleString();
            document.getElementById('profileRaces').innerText = totalRaces;
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('profileScreen').classList.remove('hidden');
            vibrate('light');
        }

        function backToMenu() {
            gameState = 'menu';
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('gameoverScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('gameHud').style.display = 'none';
            vibrate('light');
        }

        document.getElementById('btnPlay').addEventListener('click', startGame);
        document.getElementById('btnProfile').addEventListener('click', showProfile);
        document.getElementById('btnBackToMenu').addEventListener('click', backToMenu);
        document.getElementById('btnToMenu').addEventListener('click', (e) => {
            e.stopPropagation();
            backToMenu();
        });

        document.getElementById('gameoverScreen').addEventListener('click', (e) => {
            if (e.target.id !== 'btnToMenu') startGame();
        });

        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());

        initTrack();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
